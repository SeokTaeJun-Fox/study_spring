<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>점수 등록</title>
</head>
<body>
<form th:action="@{/tasks/result-ok}" method="post" th:object="${taskVO}">
    <input type="text" th:text="*{kor}" th:field="*{kor}" placeholder="국어점수를 쓰시오"/><br />
    <input type="text" th:text="*{eng}" th:field="*{eng}" placeholder="영어점수를 쓰시오"/><br />
    <input type="text" th:text="*{math}" th:field="*{math}" placeholder="수학점수를 쓰시오"/><br />
    <button>제출</button>
</form>
</body>
</html>
