<!DOCTYPE html>
<html lang="en" xmlns:th="http://thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>회원가입</title>
    <style>
        input {
            display: block;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>
<form th:action="@{/members/join}" method="post" th:object="${memberVO}">
    <input type="text" th:field="*{memberName}" placeholder="이름" />
    <input type="text" th:field="*{memberEmail}" placeholder="이메일" />
    <input type="password" th:field="*{memberPassword}" placeholder="비밀번호" />
    <button>회원가입</button>
</form>
<script>
    const inputs = document.querySelectorAll("input");
    const button = document.querySelector("button");
    const form = document.querySelector("form");

    button.addEventListener("click", () => {
        for (let input of inputs) {
            if(!input.value) {
                return alert(input.name + "값이 존재하지 않습니다.");
            }
        }
        form.submit();
    })
</script>
</body>
</html>
