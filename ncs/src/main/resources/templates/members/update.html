<!DOCTYPE html>
<html lang="en" xmlns:th="http://thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>수정</title>
    <style>
        input {
            display: block;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>
    <form th:action="@{/members/update}" method="post" th:object="${member}">
        <input type="hidden" th:field="*{id}" value="*{id}">
        <input type="text" th:field="*{memberEmail}" th:value="*{memberEmail}" placeholder="이메일" />
        <input type="password" th:field="*{memberPassword}" th:value="*{memberPassword}" placeholder="비밀번호" />
        <input type="text" th:field="*{memberName}" th:value="*{memberName}" placeholder="이름" />
        <button type="button">회원 수정</button>
    </form>
</body>
<script>
    const inputs = document.querySelectorAll("input");
    const button = document.querySelector('button');
    const form = document.querySelector('form');

    button.addEventListener('click', () => {
        for(let input of inputs) {
            if(!input.value) return alert(input.name + " 값이 존재하지 않습니다.")
        }
        form.submit();
    });
</script>
</html>
